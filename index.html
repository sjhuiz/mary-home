<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  :root {
    --ink: #10243f;
    --cream: #f6f1e7;
    --line: rgba(16, 36, 63, 0.16);
    --shadow: 0 10px 28px rgba(16, 36, 63, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Georgia, "Iowan Old Style", Palatino, serif;
    background: #e7dfd2;
    color: var(--ink);
  }
  .screen {
    min-height: 100%;
    padding: 1.25rem 1.25rem 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  #clock { font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 700; letter-spacing: -0.03em; }
  #greet { font-size: clamp(1.6rem, 4vw, 2.6rem); margin: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(9rem, 1fr));
    gap: 1rem;
    min-height: calc(100vh - 16rem);
  }
  button.tile, .search input, .panel, .choice, .back {
    border: 0;
    border-radius: 1.1rem;
    font: inherit;
    color: var(--ink);
  }
  button.tile {
    background: var(--c, #fff);
    box-shadow: var(--shadow);
    font-size: clamp(1.15rem, 2.4vw, 1.7rem);
    cursor: pointer;
    min-height: 7.25rem;
  }
  button.tile:nth-child(1) { --c: #f6e39a; }
  button.tile:nth-child(2) { --c: #f3b7a6; }
  button.tile:nth-child(3) { --c: #c9d8c4; }
  button.tile:nth-child(4) { --c: #dcc9ea; }
  button.tile:nth-child(5) { --c: #f0ddb8; }
  button.tile:nth-child(6) { --c: #c5d7ee; }
  button.tile:nth-child(7) { --c: #c5e0d8; }
  button.tile:nth-child(8) { --c: #f6ddc2; }
  button.tile:nth-child(9) { --c: #f6e39a; }
  button.tile:nth-child(10) { --c: #f3b7a6; }
  button.tile:nth-child(11) { --c: #c9d8c4; }
  button.tile:nth-child(12) { --c: #dcc9ea; }
  .search { margin-top: 0.9rem; }
  .search input {
    width: 100%;
    background: #fff;
    padding: 0.9rem 1.1rem;
    font-size: 1.35rem;
    box-shadow: var(--shadow);
  }
  .panel {
    display: none;
    background: var(--cream);
    padding: 1.25rem;
    box-shadow: var(--shadow);
    min-height: calc(100vh - 8rem);
  }
  .panel.open { display: block; }
  .panel h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 0.6rem; }
  .panel p.lead { font-size: 1.35rem; margin-top: 0; }
  .back, .choice, .panel button.go {
    background: #10243f;
    color: #fff;
    font-size: 1.25rem;
    padding: 0.8rem 1.1rem;
    cursor: pointer;
    margin: 0.35rem 0.35rem 0.35rem 0;
  }
  .choice { background: #fff; color: var(--ink); border: 2px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
  input[type="text"], textarea {
    width: 100%;
    font: inherit;
    font-size: 1.25rem;
    padding: 0.7rem 0.8rem;
    border-radius: 0.8rem;
    border: 2px solid var(--line);
  }
  ul { list-style: none; padding: 0; font-size: 1.25rem; }
  li { background: #fff; border-radius: 0.8rem; padding: 0.7rem 0.8rem; margin: 0.4rem 0; }
  .high { outline: 3px solid #b4533a; }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; }
  button.card {
    min-height: 5.5rem;
    font-size: clamp(1.2rem, 3vw, 1.7rem);
    border-radius: 1rem;
    border: 0;
    background: #10243f;
    color: transparent;
    cursor: pointer;
    font-family: inherit;
  }
  button.card.show, button.card.done { background: #fff; color: #10243f; box-shadow: var(--shadow); }
  button.card.done { background: #c9d8c4; }

  .picker { display: grid; gap: 0.85rem; }
  button.tile.pick {
    min-height: 6.2rem;
    text-align: left;
    padding: 0.9rem 1.2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 0.15rem;
  }
  button.tile.pick strong { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 700; }
  button.tile.pick span { font-size: 1.35rem; }

  .ttt {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.65rem;
    max-width: 34rem;
  }
  button.cell {
    min-height: 6.5rem;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    font-family: inherit;
    background: #fff;
    color: #10243f;
    border: 0;
    border-radius: 1rem;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  button.cell:disabled { cursor: default; }

  .spell {
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: 0.12em;
    min-height: 3.4rem;
    margin: 0.2rem 0 0.9rem;
    font-weight: 700;
  }
  .letters { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-bottom: 0.8rem; }
  button.letter {
    min-width: 4.4rem;
    min-height: 4.4rem;
    font-size: 2.1rem;
    font-family: inherit;
    background: #fff;
    color: #10243f;
    border: 0;
    border-radius: 1rem;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  button.letter:disabled { background: #e7dfd2; color: transparent; box-shadow: none; cursor: default; }
  button.letter.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .called { text-align: center; margin: 0.1rem 0 0.8rem; }
  .called-label { font-size: 1.45rem; }
  .called-num { font-size: clamp(3rem, 9vw, 4.8rem); font-weight: 700; line-height: 1; }
  .bingo-head, .bingo {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0.4rem;
  }
  .bingo-head div { text-align: center; font-size: clamp(1.35rem, 3vw, 1.8rem); font-weight: 700; }
  button.sq {
    min-height: 3.6rem;
    font-size: clamp(1.25rem, 3.4vw, 1.85rem);
    font-family: inherit;
    background: #fff;
    color: #10243f;
    border: 0;
    border-radius: 0.75rem;
    box-shadow: var(--shadow);
    cursor: pointer;
    padding: 0.2rem;
  }
  button.sq.mark { background: #c9d8c4; }
  button.sq.free { background: #f6e39a; }
  button.sq.shake { animation: shake 0.4s ease; }

  .win {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: clamp(3rem, 10vw, 6rem); z-index: 5;
  }
  .win span { display: inline-block; animation: pop 1.1s ease both; }
  @keyframes pop {
    0% { transform: scale(0.2) rotate(-8deg); opacity: 0; }
    40% { transform: scale(1.15) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @media (max-width: 800px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; }
  }
</style>
</head>
<body>
<div class="screen" id="home">
  <header>
    <div id="clock">--:--</div>
    <h1 id="greet">Good afternoon Mary</h1>
  </header>
  <div class="grid" id="grid">
    <button class="tile" id="slot-01" data-view="remember" style="grid-row:1;grid-column:1">Remember</button>
    <button class="tile" id="slot-02" data-view="game" style="grid-row:1;grid-column:2">Games</button>
    <button class="tile" id="slot-03" data-view="soon" style="grid-row:2;grid-column:1">Dr portal</button>
    <button class="tile" id="slot-04" data-view="ask" style="grid-row:2;grid-column:2">Idea</button>
  </div>
  <form class="search" id="find">
    <input id="q" type="search" placeholder="Find something" autocomplete="off">
  </form>
  <div id="hits"></div>
</div>

<section class="panel" id="panel">
  <button class="back" type="button" id="back">Back</button>
  <h1 id="ptitle"></h1>
  <p class="lead" id="plead"></p>
  <div id="pbody"></div>
</section>
<script>
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
function tick() {
  const n = new Date();
  const h = n.getHours();
  $("#clock").textContent = n.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("#greet").textContent = (h < 12 ? "Good morning Mary" : h < 17 ? "Good afternoon Mary" : "Good evening Mary");
}
tick(); setInterval(tick, 15000);

const home = $("#home"), panel = $("#panel");
function closePanel() {
  panel.classList.remove("open");
  home.style.display = "";
  leaveGame();
}
function leaveGame() {
  bingoToken++;
  const back = $("#back");
  back.textContent = "Back";
  back.onclick = closePanel;
}
$("#back").onclick = closePanel;

function openPanel(title, lead, body) {
  $("#ptitle").textContent = title;
  $("#plead").textContent = lead || "";
  $("#pbody").innerHTML = "";
  if (body) $("#pbody").append(body);
  home.style.display = "none";
  panel.classList.add("open");
  const back = $("#back");
  back.textContent = "Back";
  back.onclick = closePanel;
}

function celebrate(text) {
  document.querySelectorAll(".win").forEach((el) => el.remove());
  const win = document.createElement("div");
  win.className = "win";
  const span = document.createElement("span");
  span.textContent = text;
  win.append(span);
  document.body.append(win);
  setTimeout(() => win.remove(), 2200);
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let bingoToken = 0;

function gamesPicker() {
  bingoToken++;
  const wrap = document.createElement("div");
  wrap.className = "picker";
  const games = [
    ["Match", "Find the pairs", gameView],
    ["Tic-tac-toe", "You are X", ticView],
    ["Word jumble", "Spell a word", jumbleView],
    ["Bingo", "Mark your card", bingoView]
  ];
  games.forEach(([name, hint, open]) => {
    const b = document.createElement("button");
    b.className = "tile pick";
    b.type = "button";
    const strong = document.createElement("strong");
    strong.textContent = name;
    const span = document.createElement("span");
    span.textContent = hint;
    b.append(strong, span);
    b.onclick = open;
    wrap.append(b);
  });
  openPanel("Games", "Pick a game.", wrap);
  const back = $("#back");
  back.textContent = "Home";
  back.onclick = closePanel;
}

function goGame(title, lead, body) {
  openPanel(title, lead, body);
  const back = $("#back");
  back.textContent = "Games";
  back.onclick = gamesPicker;
}

function gameView() {
  const words = ["Sun", "Bird", "Book", "Cake", "Star", "Tree"];
  const deck = shuffle(words.concat(words));
  const wrap = document.createElement("div");
  const board = document.createElement("div");
  board.className = "cards";
  const again = document.createElement("button");
  again.className = "choice";
  again.type = "button";
  again.textContent = "New game";
  again.onclick = () => gameView();
  let open = [];
  let lock = false;
  deck.forEach((word) => {
    const b = document.createElement("button");
    b.className = "card";
    b.type = "button";
    b.textContent = word;
    b.onclick = () => {
      if (lock || b.classList.contains("show") || b.classList.contains("done")) return;
      b.classList.add("show");
      open.push(b);
      if (open.length < 2) return;
      const [a, c] = open;
      open = [];
      if (a.textContent === c.textContent) {
        a.classList.add("done");
        c.classList.add("done");
        if (board.querySelectorAll(".card.done").length === deck.length) {
          $("#plead").textContent = "You found them all.";
          celebrate("Nice!");
        }
      } else {
        lock = true;
        setTimeout(() => {
          a.classList.remove("show");
          c.classList.remove("show");
          lock = false;
        }, 900);
      }
    };
    board.append(b);
  });
  wrap.append(board, again);
  goGame("Match", "Tap two cards. Find the pairs.", wrap);
}

function ticView() {
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const cells = Array(9).fill("");
  let over = false;
  let lock = false;
  const wrap = document.createElement("div");
  const board = document.createElement("div");
  board.className = "ttt";
  const buttons = [];
  function winner(mark) {
    return lines.some(([a, b, c]) => cells[a] === mark && cells[b] === mark && cells[c] === mark);
  }
  function findMove(mark) {
    for (let i = 0; i < 9; i++) {
      if (cells[i]) continue;
      cells[i] = mark;
      const hit = winner(mark);
      cells[i] = "";
      if (hit) return i;
    }
    return -1;
  }
  function finish(text, lead) {
    over = true;
    lock = true;
    $("#plead").textContent = lead;
    celebrate(text);
  }
  function paint() {
    buttons.forEach((b, i) => { b.textContent = cells[i]; });
  }
  function cpu() {
    if (over) return;
    const empties = cells.map((v, i) => v ? -1 : i).filter((i) => i >= 0);
    if (!empties.length) return;
    const winAt = findMove("O");
    const blockAt = findMove("X");
    let pick = -1;
    if (winAt >= 0 && Math.random() < 0.45) pick = winAt;
    else if (blockAt >= 0 && Math.random() < 0.35) pick = blockAt;
    else if (!cells[4] && Math.random() < 0.4) pick = 4;
    if (pick < 0 || cells[pick]) pick = empties[Math.floor(Math.random() * empties.length)];
    cells[pick] = "O";
    paint();
    if (winner("O")) finish("Nice try", "I got three. Play again whenever you like.");
    else if (cells.every(Boolean)) finish("It's a tie", "Nobody got three. A fair game.");
    else lock = false;
  }
  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.className = "cell";
    b.type = "button";
    b.onclick = () => {
      if (over || lock || cells[i]) return;
      cells[i] = "X";
      paint();
      if (winner("X")) { finish("You win!", "You got three in a row."); return; }
      if (cells.every(Boolean)) { finish("It's a tie", "Nobody got three. A fair game."); return; }
      lock = true;
      setTimeout(cpu, 700);
    };
    buttons.push(b);
    board.append(b);
  }
  const again = document.createElement("button");
  again.className = "choice";
  again.type = "button";
  again.textContent = "New game";
  again.onclick = () => ticView();
  wrap.append(board, again);
  goGame("Tic-tac-toe", "You are X. Tap a square.", wrap);
}

const JUMBLE = ["garden", "family", "cookie", "sunday", "flower", "letter", "apple", "butter", "window", "kitten", "summer", "friend", "pillow", "orange", "pencil", "mother", "happy", "music", "river", "picnic", "candle", "bread", "yellow", "winter", "spring"];
let jumbleLast = "";

function jumbleView(forceWord) {
  let word = forceWord;
  if (!word) {
    let guard = 0;
    do {
      word = JUMBLE[Math.floor(Math.random() * JUMBLE.length)];
      guard++;
    } while (word === jumbleLast && guard < 12);
  }
  jumbleLast = word;
  let progress = 0;
  let solved = false;
  const wrap = document.createElement("div");
  const spell = document.createElement("div");
  spell.className = "spell";
  const note = document.createElement("p");
  note.className = "lead";
  const letters = document.createElement("div");
  letters.className = "letters";
  function showSpell() {
    spell.textContent = word.split("").map((ch, i) => (i < progress ? ch.toUpperCase() : "·")).join(" ");
  }
  showSpell();
  let bank = word.split("");
  let mixed = shuffle(bank);
  if (mixed.join("") === word) mixed = shuffle(bank);
  mixed.forEach((ch) => {
    const b = document.createElement("button");
    b.className = "letter";
    b.type = "button";
    b.textContent = ch.toUpperCase();
    b.onclick = () => {
      if (solved || b.disabled) return;
      if (ch === word[progress]) {
        b.disabled = true;
        progress++;
        note.textContent = "";
        showSpell();
        if (progress === word.length) {
          solved = true;
          spell.textContent = word.toUpperCase().split("").join(" ");
          $("#plead").textContent = "You spelled it.";
          celebrate("Nice!");
          next.style.display = "";
        }
      } else {
        note.textContent = "Try again";
        b.classList.remove("shake");
        void b.offsetWidth;
        b.classList.add("shake");
      }
    };
    letters.append(b);
  });
  const row = document.createElement("div");
  row.className = "row";
  const again = document.createElement("button");
  again.className = "choice";
  again.type = "button";
  again.textContent = "New word";
  again.onclick = () => jumbleView();
  const next = document.createElement("button");
  next.className = "go";
  next.type = "button";
  next.textContent = "Next word";
  next.style.display = "none";
  next.onclick = () => jumbleView();
  row.append(again, next);
  wrap.append(spell, letters, note, row);
  goGame("Word jumble", "Tap the letters in order.", wrap);
}

function bingoCard() {
  const ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
  const card = [];
  for (let c = 0; c < 5; c++) {
    const [lo, hi] = ranges[c];
    const nums = shuffle(Array.from({length: hi - lo + 1}, (_, i) => lo + i));
    let k = 0;
    for (let r = 0; r < 5; r++) {
      if (!card[r]) card[r] = [];
      if (r === 2 && c === 2) card[r][c] = null;
      else card[r][c] = nums[k++];
    }
  }
  return card;
}

function bingoView() {
  const token = ++bingoToken;
  const card = bingoCard();
  const marked = Array.from({length: 5}, () => Array(5).fill(false));
  marked[2][2] = true;
  const pool = [];
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      if (card[r][c] != null) pool.push({ r, c, n: card[r][c] });
    }
  }
  const calls = shuffle(pool);
  let callAt = 0;
  let over = false;
  let wait = false;
  const wrap = document.createElement("div");
  const called = document.createElement("div");
  called.className = "called";
  const label = document.createElement("div");
  label.className = "called-label";
  label.textContent = "Called";
  const num = document.createElement("div");
  num.className = "called-num";
  called.append(label, num);
  const note = document.createElement("p");
  note.className = "lead";
  note.textContent = "Tap that number on your card.";
  const head = document.createElement("div");
  head.className = "bingo-head";
  "BINGO".split("").forEach((ch) => {
    const d = document.createElement("div");
    d.textContent = ch;
    head.append(d);
  });
  const board = document.createElement("div");
  board.className = "bingo";
  const squares = [];
  function current() { return calls[callAt]; }
  function showCall() {
    const cur = current();
    num.textContent = cur ? String(cur.n) : "—";
  }
  function hasLine() {
    const rows = [];
    for (let i = 0; i < 5; i++) {
      const row = [];
      const col = [];
      for (let j = 0; j < 5; j++) {
        row.push(marked[i][j]);
        col.push(marked[j][i]);
      }
      rows.push(row.every(Boolean), col.every(Boolean));
    }
    const d1 = [0,1,2,3,4].every((i) => marked[i][i]);
    const d2 = [0,1,2,3,4].every((i) => marked[i][4 - i]);
    return rows.some(Boolean) || d1 || d2;
  }
  function advance() {
    if (token !== bingoToken || over) return;
    callAt++;
    wait = false;
    if (callAt >= calls.length) {
      note.textContent = "That was the whole card.";
      num.textContent = "—";
      return;
    }
    showCall();
    note.textContent = "Tap that number on your card.";
  }
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const b = document.createElement("button");
      b.className = "sq";
      b.type = "button";
      if (card[r][c] == null) {
        b.textContent = "Free";
        b.classList.add("free", "mark");
        b.disabled = true;
      } else {
        b.textContent = String(card[r][c]);
        b.onclick = () => {
          if (over || wait || marked[r][c]) return;
          const cur = current();
          if (!cur || card[r][c] !== cur.n) {
            note.textContent = "Try again";
            b.classList.remove("shake");
            void b.offsetWidth;
            b.classList.add("shake");
            return;
          }
          marked[r][c] = true;
          b.classList.add("mark");
          if (hasLine()) {
            over = true;
            $("#plead").textContent = "You got a line.";
            note.textContent = "A whole line.";
            celebrate("Nice!");
            return;
          }
          wait = true;
          note.textContent = "Good.";
          setTimeout(advance, 1600);
        };
      }
      squares.push(b);
      board.append(b);
    }
  }
  showCall();
  const again = document.createElement("button");
  again.className = "choice";
  again.type = "button";
  again.textContent = "New card";
  again.onclick = () => bingoView();
  wrap.append(called, note, head, board, again);
  goGame("Bingo", "One number at a time. Tap it when you see it.", wrap);
}

function soon(name) {
  const p = document.createElement("p");
  p.className = "lead";
  p.textContent = "The real link is not set yet.";
  openPanel(name, "", p);
}

function todoView() {
  const wrap = document.createElement("div");
  const list = document.createElement("ul");
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Add something";
  const row = document.createElement("div");
  row.className = "row";
  function render() {
    list.innerHTML = "";
    for (const item of store.get("todos", [])) {
      const li = document.createElement("li");
      li.textContent = item.text + (item.priority === "high" ? " · High" : " · Normal");
      if (item.priority === "high") li.className = "high";
      if (item.readyToSend) li.textContent += " · Ready to tell a kid";
      list.append(li);
    }
  }
  function add(priority) {
    const text = input.value.trim();
    if (!text) return;
    const items = store.get("todos", []);
    const item = { text, priority, readyToSend: false };
    if (priority === "high" && confirm("Tell one of the kids?")) item.readyToSend = true;
    items.unshift(item);
    store.set("todos", items);
    input.value = "";
    render();
  }
  const normal = document.createElement("button");
  normal.className = "choice"; normal.type = "button"; normal.textContent = "Normal";
  normal.onclick = () => add("normal");
  const high = document.createElement("button");
  high.className = "go"; high.type = "button"; high.textContent = "High";
  high.onclick = () => add("high");
  row.append(normal, high);
  wrap.append(input, row, list);
  render();
  openPanel("To do", "High only marks it ready. It does not send anything.", wrap);
}

function feelView() {
  const wrap = document.createElement("div");
  const moods = ["Glad", "Okay", "Tired", "Worried", "Unwell"];
  const row = document.createElement("div");
  row.className = "row";
  const note = document.createElement("textarea");
  note.rows = 3;
  note.placeholder = "A sentence, if you want";
  const save = document.createElement("button");
  save.className = "go"; save.type = "button"; save.textContent = "Save";
  const list = document.createElement("ul");
  let picked = "Okay";
  moods.forEach((m) => {
    const b = document.createElement("button");
    b.className = "choice"; b.type = "button"; b.textContent = m;
    b.onclick = () => { picked = m; };
    row.append(b);
  });
  function render() {
    list.innerHTML = "";
    for (const e of store.get("feelings", [])) {
      const li = document.createElement("li");
      li.textContent = e.mood + (e.note ? " · " + e.note : "");
      list.append(li);
    }
  }
  save.onclick = () => {
    const items = store.get("feelings", []);
    items.unshift({ mood: picked, note: note.value.trim(), at: Date.now() });
    store.set("feelings", items);
    note.value = "";
    render();
  };
  wrap.append(row, note, save, list);
  render();
  openPanel("How I feel", "This stays on this iPad. It is not the to-do list.", wrap);
}

function notesView() {
  const wrap = document.createElement("div");
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Write a note";
  const save = document.createElement("button");
  save.className = "go"; save.type = "button"; save.textContent = "Save";
  const list = document.createElement("ul");
  function render() {
    list.innerHTML = "";
    for (const n of store.get("notes", [])) {
      const li = document.createElement("li");
      li.textContent = n;
      list.append(li);
    }
  }
  save.onclick = () => {
    const t = input.value.trim();
    if (!t) return;
    const items = store.get("notes", []);
    items.unshift(t);
    store.set("notes", items);
    input.value = "";
    render();
  };
  wrap.append(input, save, list);
  render();
  openPanel("Remember", "Things to keep. They stay on this iPad.", wrap);
}

function askView() {
  const wrap = document.createElement("div");
  const input = document.createElement("textarea");
  input.rows = 3;
  input.placeholder = "What would you like?";
  const save = document.createElement("button");
  save.className = "go"; save.type = "button"; save.textContent = "Save";
  const msg = document.createElement("p");
  msg.className = "lead";
  save.onclick = () => {
    const t = input.value.trim();
    if (!t) return;
    const items = store.get("asks", []);
    items.unshift(t);
    store.set("asks", items);
    input.value = "";
    msg.textContent = "Saved for the next update.";
  };
  wrap.append(input, save, msg);
  openPanel("Idea", "Saved on this iPad until the next update.", wrap);
}

$("#grid").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const name = b.textContent;
  const v = b.dataset.view;
  if (v === "remember") notesView();
  else if (v === "game") gamesPicker();
  else if (v === "ask") askView();
  else soon(name);
};

$("#find").onsubmit = (e) => {
  e.preventDefault();
  const q = $("#q").value.trim().toLowerCase();
  const hits = $("#hits");
  hits.innerHTML = "";
  if (!q) return;
  const found = []
    .concat(store.get("notes", []).map((t) => "Note · " + t))
    .concat(store.get("todos", []).map((t) => "To do · " + t.text));
  const ul = document.createElement("ul");
  for (const line of found.filter((t) => t.toLowerCase().includes(q))) {
    const li = document.createElement("li");
    li.textContent = line;
    ul.append(li);
  }
  if (!ul.childElementCount) {
    const li = document.createElement("li");
    li.textContent = "Nothing saved matches.";
    ul.append(li);
  }
  hits.append(ul);
};
